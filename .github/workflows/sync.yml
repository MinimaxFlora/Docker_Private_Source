name: sync-docker-ce

on:
  schedule:
    - cron: "23 2 * * *"        # 每天 02:23 UTC（北京时间 10:23）
  workflow_dispatch:
    inputs:
      keep_versions:
        description: 每个包保留的版本数（默认 3）
        required: false
        type: number
        default: 3
      run_target:
        description: 运行目标（schedule 自动触发时全部运行）
        required: false
        type: choice
        default: all
        options:
          - all
          - deb
          - rpm

permissions:
  contents: write

jobs:
  sync-deb:
    name: deb-${{ matrix.codename }}
    if: github.event.inputs.run_target != 'rpm'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        codename: [trixie, bookworm, bullseye, noble, jammy, focal]
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y gnupg
          command -v apt-ftparchive >/dev/null || sudo apt-get -qq install -y apt

      - name: 导入签名私钥
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --yes --import
            gpg --batch --list-secret-keys --keyid-format long
          else
            echo "::warning::未配置 GPG_PRIVATE_KEY，将跳过签名（apt 校验将失败）"
          fi

      - name: 同步官方仓库 + 重签名 + 打包
        env:
          CODENAME: ${{ matrix.codename }}
          KEEP_VERSIONS: ${{ github.event.inputs.keep_versions || '3' }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: python3 sync-repo.py

      - name: 上传 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CN="${{ matrix.codename }}"
          # 固定 tag latest：URL 恒定，脚本无需探测版本
          gh release create latest --repo "$GITHUB_REPOSITORY" \
            --title "docker-ce-cn 仓库同步" \
            --notes "自动同步 docker-ce 官方仓库（$CN），GPG 重签名" 2>/dev/null || true
          # 先删后传：asset id 变化 → CDN 缓存 key 变化，客户端不会拿到旧包
          gh release delete-asset latest "docker-ce-repo-$CN.tar" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release delete-asset latest "docker-ce-repo-$CN.tar.sha256" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release upload latest \
            "docker-ce-repo-$CN.tar" "docker-ce-repo-$CN.tar.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

  sync-rpm:
    name: rpm-${{ matrix.id }}
    if: github.event.inputs.run_target != 'deb'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 官方 rocky/rhel 目录不发布 docker-ce（rocky 仅插件包），
          # el7/el9/el10 统一取 centos 源的 el 系 rpm，Rocky/CentOS/RHEL/Alma 通用
          - { distro: centos, version: "7",  id: el7 }
          - { distro: centos, version: "9",  id: el9 }
          - { distro: centos, version: "10", id: el10 }
          - { distro: fedora, version: "44", id: fedora-44 }
          - { distro: fedora, version: "43", id: fedora-43 }
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y gnupg createrepo-c python3-zstandard

      - name: 导入签名私钥
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --yes --import
            gpg --batch --list-secret-keys --keyid-format long
          else
            echo "::warning::未配置 GPG_PRIVATE_KEY，将跳过签名（dnf 校验将失败）"
          fi

      - name: 同步官方仓库 + 重签名 + 打包
        env:
          RPM_DISTRO: ${{ matrix.distro }}
          RPM_VERSION: ${{ matrix.version }}
          RPM_ID: ${{ matrix.id }}
          KEEP_VERSIONS: ${{ github.event.inputs.keep_versions || '3' }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: python3 sync-repo.py

      - name: 上传 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ID="${{ matrix.id }}"
          gh release create latest --repo "$GITHUB_REPOSITORY" \
            --title "docker-ce-cn 仓库同步" \
            --notes "自动同步 docker-ce 官方仓库（rpm: $ID），GPG 重签名" 2>/dev/null || true
          # 先删后传：asset id 变化 → CDN 缓存 key 变化，客户端不会拿到旧包
          gh release delete-asset latest "docker-ce-repo-rpm-$ID.tar" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release delete-asset latest "docker-ce-repo-rpm-$ID.tar.sha256" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release upload latest \
            "docker-ce-repo-rpm-$ID.tar" "docker-ce-repo-rpm-$ID.tar.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
